<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTLOC - Tienda en Línea</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; padding: 20px; text-align: center; }
        .tarjeta-producto { background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 300px; margin: 20px auto; padding: 15px; border: 1px solid #ddd; }
        .etiqueta-badge { background-color: #333; color: white; padding: 5px 10px; font-size: 12px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
        .imagen-prod { width: 100%; height: auto; border-radius: 4px; }
        .info-prod h2 { font-size: 20px; margin: 10px 0; color: #333; }
        .precio { color: #e91e63; font-weight: bold; font-size: 18px; margin: 5px 0; }
        .descripcion-corta { font-size: 14px; color: #666; margin-bottom: 15px; }
        .boton-whatsapp { display: inline-block; background-color: #25D366; color: white; padding: 10px 15px; text-decoration: none; font-weight: bold; border-radius: 5px; transition: background 0.3s; }
        .boton-whatsapp:hover { background-color: #128C7E; }
    </style>
</head>
<body>

    <h1>Mi Tienda ARTLOC</h1>

    <!-- PRODUCTO 27: PULSERA -->
    <div class="tarjeta-producto">
        <div class="etiqueta-badge">Acero inoxidable</div>
        <img src="joya27.jpg" alt="HIPOALERGENICO" class="imagen-prod">
        <div class="info-prod">
            <h2>PULSERA</h2>
            <p class="precio">$119.99 MXN</p>
            <p class="descripcion-corta">Pulsera de hojas, exquisita para cada estilo.</p>
            
            <!-- Botón de WhatsApp Seguro -->
            <a href="https://wa.me/529611071616" target="_blank" class="boton-whatsapp">
                Pedir por WhatsApp 💬
            </a>
        </div>
    </div>

</body>
</html>
